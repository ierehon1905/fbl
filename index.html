<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="./favicon.png" />
    <title>fbl — a language for Factorio blueprints</title>
  </head>
  <body>
    <div id="app">
      <header class="toolbar">
        <button id="menu" type="button" class="burger" aria-label="menu" aria-expanded="false">
          <span></span><span></span><span></span>
        </button>
        <span class="brand">fbl<span class="brand-dim">/studio</span></span>

        <label class="field">
          <span>version</span>
          <select id="version"></select>
        </label>

        <span class="spacer"></span>

        <span id="stats" class="stats"></span>
        <span id="art" class="art" title="the game art these sprites came from"></span>
        <a class="ghost" href="./calc.html" title="Work out what a factory has to run at">calculator</a>
        <button id="power" type="button" class="ghost" title="Show what the poles reach (P)">power</button>
        <button id="build" type="button" class="ghost" aria-pressed="false"
                title="Edit entities on the map, writing back to the source (B)">build</button>
        <button id="fit" type="button" class="ghost" title="Fit to view (F)">fit</button>
        <button id="copy" type="button" class="primary">copy blueprint</button>
      </header>

      <main class="panes">
        <section class="pane pane-editor"><div id="editor"></div></section>
        <div class="splitter" id="splitter" role="separator" aria-orientation="vertical"></div>
        <section class="pane pane-preview">
          <div class="tabs" id="tabs">
            <button type="button" data-tab="blueprint" class="active">blueprint</button>
            <button type="button" data-tab="docs">docs</button>
          </div>

          <div class="tab-body" id="tab-blueprint">
            <canvas id="canvas"></canvas>
            <div id="tooltip" class="tooltip" hidden></div>
            <div class="panels">
              <aside id="cost" class="panel" hidden></aside>
              <aside id="rates" class="panel" hidden></aside>
            </div>
            <div id="loading" class="loading">loading game data…</div>
            <div id="preload" class="preload" hidden></div>
            <nav id="trail" class="trail" hidden></nav>
            <aside id="entity" class="entity-panel" hidden></aside>
          </div>

          <div class="tab-body" id="tab-docs" hidden><article id="docs" class="docs"></article></div>
        </section>
      </main>

      <footer id="console" class="console"></footer>

      <div id="scrim" class="scrim" hidden></div>
      <aside id="drawer" class="drawer" hidden></aside>
    </div>
    <script type="module" src="/src/ui/main.ts"></script>
  </body>
</html>
